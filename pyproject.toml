[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ideas"
version = "0.1.0"
description = "Mine winning hackathon projects and the unmet needs nobody has built yet"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tenacity>=8.2.0",
    "python-dateutil>=2.8.2",
    "tqdm>=4.66.0",
    "flask>=3.0.0",
    "anthropic>=1.4.0",
]

[project.scripts]
ideas = "ideas.cli:main"

[tool.setuptools.packages.find]
include = ["ideas*"]

# dashboard.html ships inside the package rather than a top-level templates/,
# so Flask finds it relative to ideas/web/ with no configuration.
[tool.setuptools.package-data]
"ideas.web" = ["templates/*.html"]
